<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tab 1 / Main</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=640, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="allStyles/styles.css">
    <link rel="stylesheet" href="allStyles/stylesDash.css">
    <script src="allScripts/script.js" defer></script>
    <script src="allScripts/scriptDash.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>This Week...</h1>

        <div class="content">
            <div class="calendar-island">
                <div class="calendar">
                    <div class="calendar-row">
                        <div class="calendar-column">
                            <div class="day-label">Sun</div>
                            <button class="day-circle" onclick="selectDay(this)">23</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Mon</div>
                            <button class="day-circle" onclick="selectDay(this)">24</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Tue</div>
                            <button class="day-circle" onclick="selectDay(this)">25</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Wed</div>
                            <button class="day-circle" id="default-selected" onclick="selectDay(this)">26</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Thu</div>
                            <button class="day-circle" onclick="selectDay(this)">27</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Fri</div>
                            <button class="day-circle" onclick="selectDay(this)">28</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Sat</div>
                            <button class="day-circle" onclick="selectDay(this)">29</button>
                        </div>
                    </div>
                </div>                
            </div>

            <div class="progress-island">
                <h2>Today's Progress</h2>
                <div class="progress-container-row">
                    <!-- Step Tracker Left -->
                    <div class="progress-left">
                        <svg class="progress-ring" width="120" height="120">
                            <circle class="progress-ring__bg" cx="60" cy="60" r="50" />
                            <circle class="progress-ring__circle" cx="60" cy="60" r="50" />
                        </svg>
                        <p class="step-info"><strong id="step-count">4,250</strong> / 10,000 steps</p>
                    </div>
            
                    <!-- Stats Right -->
                    <div class="progress-right">
                        <div class="stat-row">
                            <img src="icons/FireIcon.jpeg" alt="flame icon" class="stat-icon">
                            <p class="stat-label"><strong id = "calories-count">200</strong> Calories Burned</p>
                        </div>
                        <div class="stat-row">
                            <img src="icons/StreakIcon.jpeg" alt="streak icon" class="stat-icon">
                            <p class="stat-label"><strong id = "streak-count"> 2</strong> Day Streak</p>
                        </div>
                    </div>
                </div>
            </div>
                   

            <a href="weekly-report.html" class="weekly-report-button">Your Weekly Report</a>
        </div>

        <!-- Main Image Section -->
        <div class="image-container">
            <!-- Dashboard Icon -->
            <div class="image-item active">
                <div class="dashboard-icon">
                    <a href="index.html">
                        <img src="icons/dashboard.svg" alt="Dashboard">
                        <p class="alt-text">Dashboard</p>
                        <div class="overlay"></div>
                    </a>
                </div>
            </div>

            <!-- Nutrition Icon -->
            <div class="image-item">
                <div class="nutrition-icon">
                    <a href="nutrition.html">
                        <img src="icons/apple 2.svg" alt="Nutrition">
                        <p class="alt-text">Nutrition</p>
                    </a>
                </div>
            </div>

            <!-- Plus Button in the center -->
            <div class="image-item">
                <button class="plus-button" id="plusButton">+</button>
            </div>
        

            <!-- Exercise Icon -->
            <div class="image-item">
                <div class="exercise-icon">
                    <a href="exercise.html">
                        <img src="icons/dumbell 1.svg" alt="Exercise">
                        <p class="alt-text">Workout</p>
                    </a>
                </div>
            </div>

            <!-- Settings Icon -->
            <div class="image-item">
                <div class="settings-icon">
                    <a href="settings.html">
                        <img src="icons/settings.svg" alt="Settings">
                        <p class="alt-text">Settings</p>
                    </a>
                </div>
            </div>
        </div>

        <!-- Exercise/Meal options -->
        <div class="overlay-container" id="overlayContainer">
            <button class="close-overlay" id="closeOverlayButton" onclick="closeOverlay()">X</button>
            <div class="overlay-item" id="exerciseButton">
                <button onclick="displayExerciseForm()">Exercise</button>
            </div>
            <div class="overlay-item" id="mealButton">
                <button onclick="displayMealForm()">Meal</button>
            </div>
        </div>
        
        <!-- Exercise Form (Hidden) -->
        <div id="exerciseForm" class="exercise-form" style="display: none;">
            <button class="close-btn" onclick="closeForm()">X</button>
            <h2>Exercise</h2>
            <select>
                <option value="Cycling">Cycling</option>
                <option value="Hiking">Hiking</option>
                <option value="Rowing">Rowing</option>
                <option value="Rock Climbing">Rock Climbing</option>
                <option value="Running">Running</option>
                <option value="Sport Practice">Sport Practice</option>
                <option value="Walking">Walking</option>
                <option value="Workout">Workout</option>
                <option value="Yoga">Yoga</option>
            </select>
            <textarea placeholder="Describe your exercise..."></textarea>
            <input type="number" placeholder="Duration (minutes)">
            <!-- <label>How did you feel?</label> -->
            <!-- <input type="range" min="1" max="10" placeholder="How did you feel?"> --> <!-- Not sure if we want to do this, might implement different variation later-->
            <!-- <small>1 = Worst, 10 = Best</small> -->
            <button onclick="submitForm('exercise')">Add Exercise</button>
        </div>

        <!-- Meal Form (Hidden) -->
        <div id="mealForm" class="meal-form" style="display: none;">            
            <button class="close-btn" onclick="closeForm()">X</button>
            <h2>Meal</h2>
            <input type="text" placeholder="Food Name">
            <select>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snack">Snack</option>
            </select>
            <textarea placeholder="Describe your meal..."></textarea>
            <input type="number" placeholder="Calories">
            <button onclick="submitForm('meal')">Add Meal</button>
        </div>

        <!-- Overlay Background for Forms -->
        <div id="overlayBackground" class="overlay-background"></div>

    </div>
</body>
</html>
