<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Workout</title>
    <link rel="stylesheet" href="allStyles/exerciseStyle.css">
    <script src="allStyles/exerciseScript.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Add Your Workout</h1>

        <!-- Workout Form -->
        <div class="workout-form">
            <label for="workout-name">Workout Name:</label>
            <input type="text" id="workout-name" placeholder="Enter workout name">

            <label for="workout-type">Workout Type:</label>
            <select id="workout-type">
                <option value="strength">Strength Training</option>
                <option value="cardio">Cardio</option>
                <option value="flexibility">Flexibility</option>
                <option value="other">Other</option>
            </select>

            <label for="workout-duration">Duration (minutes):</label>
            <input type="number" id="workout-duration" placeholder="Enter duration">

            <label for="workout-description">Description:</label>
            <textarea id="workout-description" placeholder="Describe your workout"></textarea>

            <button type="submit" onclick="saveWorkout()">Save Workout</button>
        </div>
    </div>
</body>
</html>
