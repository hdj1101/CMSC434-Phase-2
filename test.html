<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="stylesTest.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1 class="title">This Week</h1>
        </header>
        
        <main class="main-content">
            <div class="calendar-island">
                <div class="calendar">
                    <div class="calendar-row">
                        <div class="calendar-column">
                            <div class="day-label">Sun</div>
                            <button class="day-circle" onclick="selectDay(this)">23</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Mon</div>
                            <button class="day-circle" onclick="selectDay(this)">24</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Tue</div>
                            <button class="day-circle" onclick="selectDay(this)">25</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Wed</div>
                            <button class="day-circle" id="default-selected" onclick="selectDay(this)">26</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Thu</div>
                            <button class="day-circle" onclick="selectDay(this)">27</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Fri</div>
                            <button class="day-circle" onclick="selectDay(this)">28</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Sat</div>
                            <button class="day-circle" onclick="selectDay(this)">29</button>
                        </div>
                    </div>
                </div>                
            </div>

            <div class="progress-island">
                <h2>Today's Progress</h2>
                <div class="progress-container-row">
                    <!-- Step Tracker Left -->
                    <div class="progress-left">
                        <svg class="progress-ring" width="120" height="120">
                            <circle class="progress-ring__bg" cx="60" cy="60" r="50" />
                            <circle class="progress-ring__circle" cx="60" cy="60" r="50" />
                        </svg>
                        <p class="step-info"><strong id="step-count">4,250</strong> / 10,000 steps</p>
                    </div>
            
                    <!-- Stats Right -->
                    <div class="progress-right">
                        <div class="stat-row">
                            <img src="icons/FireIcon.jpeg" alt="flame icon" class="stat-icon">
                            <p class="stat-label"><strong id = "calories-count">200</strong> Calories Burned</p>
                        </div>
                        <div class="stat-row">
                            <img src="icons/StreakIcon.jpeg" alt="streak icon" class="stat-icon">
                            <p class="stat-label"><strong id = "streak-count"> 2</strong> Day Streak</p>
                        </div>
                    </div>
                </div>
            </div>
                   

            <a href="weekly-report.html" class="weekly-report-button">Your Weekly Report</a>
            
        </main>
    </div>

    <script>
        function selectDay(button) {
            // Reset all buttons
            const buttons = document.querySelectorAll('.day-circle');
            buttons.forEach(btn => btn.style.backgroundColor = '#f0f0f0');
    
            // Set the selected button to red
            button.style.backgroundColor = '#F48668';
    
            // ✅ Get the calendar day number from the button (e.g. 23, 24...)
            const day = parseInt(button.textContent, 10);
    
            // ✅ Update the stats for that day
            updateStatsForDay(day);
        }
    
        // ✅ Fitness data keyed by real date numbers (23–29)
        const dayData = {
            23: { steps: 3200, calories: 130, streak: 0 },
            24: { steps: 11000, calories: 440, streak: 1 },
            25: { steps: 10342, calories: 400, streak: 2 },
            26: { steps: 4250, calories: 160, streak: 2 }, // Default selection
            27: { steps: 0, calories: 0, streak: 2 },
            28: { steps: 0, calories: 0, streak: 2 },
            29: { steps: 0, calories: 0,  streak: 2 },
        };
    
        function updateStatsForDay(day) {
            const data = dayData[day] || { steps: 0, calories: 0, streak: 0 };
            updateProgressCircle(data.steps);
            document.getElementById('calories-count').textContent = data.calories;
            document.getElementById('streak-count').textContent = data.streak;
        }
    
        function updateProgressCircle(steps) {
            const circle = document.querySelector('.progress-ring__circle');
            const stepCount = document.getElementById('step-count');
            const radius = 50;
            const circumference = 2 * Math.PI * radius;
    
            const percent = Math.min(steps / 10000, 1);
            const offset = circumference - percent * circumference;
    
            circle.style.strokeDasharray = `${circumference}`;
            circle.style.strokeDashoffset = `${offset}`;
            stepCount.textContent = steps.toLocaleString();
        }
    
        // ✅ Select the default day (26) on page load
        window.onload = function () {
            const defaultButton = document.getElementById('default-selected');
            if (defaultButton) {
                selectDay(defaultButton);
            }
        };
    </script>
    
</body>
</html>
