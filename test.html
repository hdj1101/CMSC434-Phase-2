<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="stylesTest.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1 class="title">Dashboard</h1>
        </header>
        
        <main class="main-content">
            <div class="calendar-container">
                <div class="calendar">
                    <div class="calendar-row">
                        <div class="calendar-column">
                            <div class="day-label">Sun</div>
                            <button class="day-circle" onclick="selectDay(this)">1</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Mon</div>
                            <button class="day-circle" onclick="selectDay(this)">2</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Tue</div>
                            <button class="day-circle" onclick="selectDay(this)">3</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Wed</div>
                            <button class="day-circle" onclick="selectDay(this)">4</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Thu</div>
                            <button class="day-circle" onclick="selectDay(this)">5</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Fri</div>
                            <button class="day-circle" onclick="selectDay(this)">6</button>
                        </div>
                        <div class="calendar-column">
                            <div class="day-label">Sat</div>
                            <button class="day-circle" onclick="selectDay(this)">7</button>
                        </div>
                    </div>
                </div>                
            </div>

            <div class="progress-island">
                <h2>Today's Progress</h2>
                <div class="progress-container">
                    <svg class="progress-ring" width="120" height="120">
                        <circle class="progress-ring__bg" cx="60" cy="60" r="50" />
                        <circle class="progress-ring__circle" cx="60" cy="60" r="50" />
                    </svg>
                    <div class="step-info">
                        <p><strong id="step-count">4,250</strong> / 10,000 steps</p>
                    </div>
                </div>
            </div>

            <a href="weekly-report.html" class="weekly-report-button">Your Weekly Report</a>
            
        </main>

        <footer class="footer">
            <p>&copy; 2025 Your Company</p>
        </footer>
    </div>

    <script>
        function selectDay(button) {
            // Reset all buttons
            const buttons = document.querySelectorAll('.day-circle');
            buttons.forEach(btn => btn.style.backgroundColor = '#f0f0f0');

            // Set the selected button to blue
            button.style.backgroundColor = 'lightblue';
        }

    /*Animate Step Progress below*/
    const stepGoal = 10000;
    let currentSteps = 4250; // Can be updated based on selected day

    function updateProgressCircle(steps) {
        const circle = document.querySelector('.progress-ring__circle');
        const stepCount = document.getElementById('step-count');
        const radius = 50;
        const circumference = 2 * Math.PI * radius;

        const percent = Math.min(steps / stepGoal, 1);
        const offset = circumference - percent * circumference;

        circle.style.strokeDasharray = `${circumference}`;
        circle.style.strokeDashoffset = `${offset}`;
        stepCount.textContent = steps.toLocaleString();
    }

    updateProgressCircle(currentSteps);
    </script>
</body>
</html>
