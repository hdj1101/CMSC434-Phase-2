<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tab 1 / Main</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=640, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="allStyles/styles.css">
    <link rel="stylesheet" href="allStyles/stylesNutritionPrev.css">
    <script src="allScripts/script.js" defer></script>
    <script src="allScripts/scriptNutritionPrev.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>-Nutrition-</h1>
        <div class="content">
            <!-- Main content of the page here -->
        </div>

        <!-- <div class="date-text" id="date-text"></div> -->

        <div class="calendar-container">
            <div class="calendar-days">
                <button id="prevWeek" class="cal-arrow-button">&#60;</button>
                <div class="day" id="sun" onclick="goToNutritionPage('nutrition-04-23')">23</div>
                <div class="day selected" id="mon" onclick="goToNutritionPage('nutrition-04-24')">24</div>
                <div class="day" id="tue" onclick="goToNutritionPage('nutrition-04-25')">25</div>
                <div class="day" id="wed" onclick="goToNutritionPage('nutrition')">26</div>
                <div class="day" id="thu" onclick="goToNutritionPage('nutrition-04-27')" >27</div>
                <div class="day" id="fri" onclick="goToNutritionPage('nutrition-04-28')">28</div>
                <div class="day" id="sat" onclick="goToNutritionPage('nutrition-04-29')">29</div>
                <button id="nextWeek" class="cal-arrow-button">&#62;</button>
            </div>
        </div>

        <div class="circle-container">
            <div class="circle meals"></div>
            <div class="circle goal">
                <div class="goal-text" id="goal-text">
                    <!-- Text updates dynamically -->
                </div>
            </div>
            <div class="circle progress" id="progress-circle"></div>
        </div>

        <div class="circle-overlay-box" id="overlay-box"> </div>

        <div class="main-box">
            <h2>Recent Meals</h2>
            <div class="meal-grid">
                <div class="meal-box" onclick="showMealDetails('Quesadilla', 'Dinner', 200, '1g', '0mg', '85mg', '1g')">
                    <p>Quesadilla</p>
                    <p>200 cal</p>
                </div>
                <div class="meal-box" onclick="showMealDetails('Sausage Links', 'Dinner', 300, '20g', '50mg', '400mg', '30g')">
                    <p>Sausage Links</p>
                    <p>300 cal</p>
                </div>
                <div class="meal-box" onclick="showMealDetails('Chicken Wrap', 'Lunch', 240, '0g', '0mg', '10mg', '5g')">
                    <p>Chicken Wrap</p>
                    <p>500 cal</p>
                </div>
                <div class="meal-box" onclick="showMealDetails('Cereal', 'Breakfast', 100, '5g', '0mg', '150mg', '8g')">
                    <p>Cereal</p>
                    <p>500 cal</p>
                </div>
            </div>
        </div>
        
        <!-- Meal Details Overlay -->
        <div id="mealOverlay" class="meal-overlay">
            <div class="meal-details">
                <button class="close-btn" onclick="closeMealOverlay()">X</button>
                <h2 id="mealName">Meal Name</h2>
                <p><strong>Meal Type:</strong> <span id="mealType"></span></p>
                <p><strong>Calories:</strong> <span id="mealCalories"></span></p>
                <p><strong>Total Fat:</strong> <span id="mealFat"></span></p>
                <p><strong>Cholesterol:</strong> <span id="mealCholesterol"></span></p>
                <p><strong>Sodium:</strong> <span id="mealSodium"></span></p>
                <p><strong>Protein:</strong> <span id="mealProtein"></span></p>
            </div>
        </div>

        <!-- Main Image Section -->
        <div class="image-container">
            <!-- Dashboard Icon -->
            <div class="image-item">
                <div class="dashboard-icon">
                    <a href="index.html">
                        <img src="icons/dashboard.svg" alt="Dashboard">
                        <p class="alt-text">Dashboard</p>
                    </a>
                </div>
            </div>

            <!-- Nutrition Icon -->
            <div class="image-item active">
                <div class="nutrition-icon">
                    <a href="nutrition.html">
                        <img src="icons/apple 2.svg" alt="Nutrition">
                        <p class="alt-text">Nutrition</p>
                        <div class="overlay"></div>
                    </a>
                </div>
            </div>

            <!-- Plus Button in the center -->
            <div class="image-item">

                <button class="plus-button" id="plusButton">+</button>
            </div>
        

            <!-- Exercise Icon -->
            <div class="image-item">
                <div class="exercise-icon">
                    <a href="exercise.html">
                        <img src="icons/dumbell 1.svg" alt="Exercise">
                        <p class="alt-text">Workout</p>
                    </a>
                </div>
            </div>

            <!-- Settings Icon -->
            <div class="image-item">
                <div class="settings-icon">
                    <a href="settings.html">
                        <img src="icons/settings.svg" alt="Settings">
                        <p class="alt-text">Settings</p>
                    </a>
                </div>
            </div>
        </div>

        <!-- Exercise/Meal options -->
        <div class="overlay-container" id="overlayContainer">
            <button class="close-overlay" id="closeOverlayButton" onclick="closeOverlay()">X</button>
            <div class="overlay-item" id="exerciseButton">
                <button onclick="displayExerciseForm()">Exercise</button>
            </div>
            <div class="overlay-item" id="mealButton">
                <button onclick="displayMealForm()">Meal</button>
            </div>
        </div>
        
        <!-- Exercise Form (Hidden) -->
        <div id="exerciseForm" class="exercise-form" style="display: none;">
            <button class="close-btn" onclick="closeForm()">X</button>
            <h2>Exercise</h2>
            <select>
                <option value="Cycling">Cycling</option>
                <option value="Hiking">Hiking</option>
                <option value="Rowing">Rowing</option>
                <option value="Rock Climbing">Rock Climbing</option>
                <option value="Running">Running</option>
                <option value="Sport Practice">Sport Practice</option>
                <option value="Walking">Walking</option>
                <option value="Workout">Workout</option>
                <option value="Yoga">Yoga</option>
            </select>
            <textarea placeholder="Describe your exercise..."></textarea>
            <input type="number" placeholder="Duration (minutes)">
            <textarea placeholder="How did you feel?"></textarea>
            <button onclick="submitForm('exercise')">Add Exercise</button>
        </div>

        <!-- Meal Form (Hidden) -->
        <div id="mealForm" class="meal-form" style="display: none;">                
            <button class="close-btn" onclick="closeForm()">X</button>
            <h2>Meal</h2>
            <input type="text" placeholder="Food Name">
            <select>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snack">Snack</option>
            </select>
            <textarea placeholder="Describe your meal..."></textarea>
            <input type="number" placeholder="Calories">
            <input type="number" placeholder="Fat">
            <input type="number" placeholder="Cholesterol">
            <input type="number" placeholder="Sodium">
            <input type="number" placeholder="Protein">
            <button onclick="submitForm('meal')">Add Meal</button>
        </div>

        <!-- Overlay Background for Forms -->
        <div id="overlayBackground" class="overlay-background"></div>

    </div>
</body>
</html>
