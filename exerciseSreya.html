<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise App</title>
    <link rel="stylesheet" href="exerciseStyle.css">
</head>
<body>
    <header>
        <h1>Exercise</h1>
        <div class="menu-icon">&#9776;</div>
    </header>

    <section class="search-section">
        <input type="text" id="search-bar" placeholder="Search for exercises...">
        <select id="age-select">
            <option value="">Select Age</option>
            <option value="18-25">18-25</option>
            <option value="26-35">26-35</option>
            <option value="36-45">36-45</option>
        </select>
        <select id="experience-select">
            <option value="">Select Experience Level</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>
    </section>

    <section class="exercise-list">
        <div class="exercise-item">
            <h3>Push-up</h3>
            <p>Push-ups are great for building upper body strength.</p>
            <button class="add-exercise-btn">Add to Regimen</button>
        </div>
        <div class="exercise-item">
            <h3>Squats</h3>
            <p>Squats help in building lower body strength.</p>
            <button class="add-exercise-btn">Add to Regimen</button>
        </div>
        <!-- Add more exercises here -->
    </section>

    <section class="exercise-details">
        <h2>Add Exercise to Regimen</h2>
        <input type="text" id="exercise-name" placeholder="Exercise Name">
        <textarea id="exercise-description" placeholder="Exercise Description"></textarea>
        <input type="number" id="sets" placeholder="Sets" min="1">
        <input type="number" id="reps" placeholder="Reps per Set" min="1">
        <button id="save-exercise-btn">Save Exercise</button>
    </section>

    <section class="progress-section">
        <h2>Your Progress</h2>
        <textarea id="progress-notes" placeholder="Add your progress here..."></textarea>
        <button id="save-progress-btn">Save Progress</button>
    </section>

    <script src="exerciseScript.js"></script>
</body>
</html>
